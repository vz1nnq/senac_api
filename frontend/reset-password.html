<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Crie uma nova senha para sua conta Gestão Escolar.">
  <title>Nova senha · Gestão Escolar</title>
  <link rel="stylesheet" href="style.css">
  <script src="reset-password.js" defer></script>
</head>
<body class="reset-page">
  <main class="reset-layout">
    <header class="reset-header">
      <a class="brand" href="index.html" aria-label="Gestão Escolar, voltar ao acesso">
        <span class="brand-mark" aria-hidden="true">GE</span>
        <span><strong>Gestão Escolar</strong><small>Painel administrativo</small></span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar modo escuro" aria-pressed="false"><span aria-hidden="true">☾</span><span class="theme-label">Modo escuro</span></button>
    </header>
    <section class="reset-card" aria-labelledby="reset-title">
      <span class="reset-icon" aria-hidden="true">✳</span>
      <p class="eyebrow">RECUPERAÇÃO DE ACESSO</p>
      <h1 id="reset-title">Crie uma nova senha.</h1>
      <p class="auth-description">Escolha uma senha segura com pelo menos 6 caracteres para voltar ao seu painel.</p>
      <form id="reset-form" class="auth-form">
        <label for="new-password">Nova senha</label>
        <input id="new-password" name="novaSenha" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required>
        <label for="confirm-password">Confirme a nova senha</label>
        <input id="confirm-password" name="confirmacao" type="password" minlength="6" autocomplete="new-password" placeholder="Digite a senha novamente" required>
        <button class="button button-primary auth-submit" type="submit"><span>Salvar nova senha</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-feedback" id="reset-feedback" aria-live="polite" role="status"></p>
      <a class="reset-login-link" id="login-link" href="index.html" hidden>Voltar para o acesso</a>
    </section>
    <p class="auth-copyright">© <span id="current-year"></span> Gestão Escolar · Acesso administrativo</p>
  </main>
</body>
</html>
